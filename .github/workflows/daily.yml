name: Aggiornamento prezzi giornaliero
on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 ora di Roma (inverno)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "wishlist-bot"
          git config user.email "wishlist-bot@users.noreply.github.com"
          python3 scripts/update_prices.py
          python3 scripts/update_prices.py --collection gold --eu-only --commit
